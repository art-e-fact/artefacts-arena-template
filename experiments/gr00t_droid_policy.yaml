# GR00T closed-loop policy config for the DROID embodiment.
#
# A copy of isaaclab_arena_gr00t/policy/config/droid_manip_gr00t_closedloop_config.yaml
# with the three joint-config paths rewritten relative to this project root. The
# loader resolves every one of these paths against the current working directory
# and asserts it exists, so Arena's own copy only works when run from the Arena
# repo root — which is not where this project's environment specs resolve from.

action_horizon: 32
embodiment_tag: OXE_DROID
video_backend: decord

policy_joints_config_path: submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/droid/gr00t_8dof_joint_space.yaml
action_joints_config_path: submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/droid/8dof_joint_space.yaml
state_joints_config_path: submodules/IsaacLab-Arena/isaaclab_arena_gr00t/embodiments/droid/13dof_joint_space.yaml

# Number of actions executed per inference rollout; may be less than action_horizon.
action_chunk_length: 32
task_mode_name: droid_manipulation

pov_cam_name_sim: ["external_camera_rgb", "wrist_camera_rgb"]

original_image_size: [720, 1280, 3]
target_image_size: [180, 320, 3]
