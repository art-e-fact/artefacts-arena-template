# Evaluate environments/tasks/banana_in_bowl.yaml with Arena's Experiment Runner.
#
#   source setup.sh
#   python submodules/IsaacLab-Arena/isaaclab_arena/evaluation/experiment_runner.py \
#     --experiment_config experiments/banana_in_bowl.yaml --viz none
#
# `environment.type` is a spec path, opened relative to the shell's working
# directory — run the command from the repo root.
#
# zero_action holds every joint still: it never solves the task, it proves the
# environment builds, steps and scores. Swap `policy` to evaluate a real one.

runs:
  zero_action:
    environment:
      type: environments/tasks/banana_in_bowl.yaml
    policy:
      type: zero_action
    environment_builder:
      num_envs: 1
      language_instruction: Pick up the banana and place it in the bowl.
    rollout_limit:
      num_episodes: 2
