# Evaluate environments/tasks/banana_in_bowl.yaml with an openpi pi05 checkpoint.
#
# Terminal 1 — the inference server, left running:
#   cd submodules/IsaacLab-Arena
#   ./isaaclab_arena_openpi/docker/run_openpi_server.sh -v pi05 -p 8000
#
# Terminal 2 — the rollout, from the repo root:
#   source setup.sh
#   python submodules/IsaacLab-Arena/isaaclab_arena/evaluation/experiment_runner.py \
#     --experiment_config experiments/banana_in_bowl_openpi.yaml --viz none
#
# pi05 commands absolute joint positions, which is why the spec's embodiment is
# droid_abs_joint_pos. The policy reads camera images, so the environment must
# enable them; the spec supplies everything else.

runs:
  pi05:
    environment:
      type: environments/tasks/banana_in_bowl.yaml
      enable_cameras: true
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    environment_builder:
      num_envs: 1
      language_instruction: Pick up the banana and place it in the bowl.
    rollout_limit:
      num_episodes: 3
