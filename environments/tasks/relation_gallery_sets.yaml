env_name: relation_gallery_sets
external_yaml: ../scenes/relation_gallery_sets.yaml
placement_validators:
  enabled_checks: [no_overlap, on_relation, next_to]
  required_checks: [no_overlap, on_relation]
cli_override_specs:
- arg: embodiment
  target_node_id: droid
- arg: object
  target_node_id: apple
task:
  composition: parallel
  description: pick up the snack and place it in the bowl ; pick up the apple and place it in the bowl
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: snack_set
      destination_location: bowl
      background_scene: maple_table_robolab
      episode_length_s: 60.0
  - kind: PickAndPlaceTask
    params:
      pick_up_object: apple
      destination_location: bowl
      background_scene: maple_table_robolab
      episode_length_s: 60.0
