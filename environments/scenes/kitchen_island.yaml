# A full kitchen: DROID on a stand beside the island of a Lightwheel kitchen, a plate with fruit on
# it, a bowl, a mug and a milk carton on the island top. Objects stand on prims of the kitchen
# through object_references, and the position limits keep them inside the view from the
# background's own camera. arena-composer's README video plays in this scene.
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_with_island_industrial
  params:
    # Keeps the objects off the kitchen's own props, the plant on the island among them, which the
    # spec does not name. The default, bbox, cannot: the kitchen's box holds everything.
    collision_mode: mesh
objects:
- id: plate
  registry_name: plate_large_vomp_robolab
  params: {}
- id: apple
  registry_name: apple_01_objaverse_robolab
  params: {}
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
  params: {}
- id: mug
  registry_name: mug_ycb_robolab
  params: {}
- id: milk
  registry_name: milk_carton_hope_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: island_top
  parent_id: kitchen
  prim_path: island_island_group/top_geometry
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: island_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: island_top
  params:
    side: positive_y
    cross_position_ratio: 0.0
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.57
- kind: 'on'
  subject: plate
  reference: island_top
  params: {}
- kind: position_limits_box
  subject: plate
  params:
    x_limits: [2.55, 2.75]
    y_limits: [-4.0, -3.7]
- kind: 'on'
  subject: apple
  reference: plate
  params: {}
- kind: 'on'
  subject: banana
  reference: plate
  params: {}
- kind: 'on'
  subject: wooden_bowl
  reference: island_top
  params: {}
- kind: next_to
  subject: wooden_bowl
  reference: plate
  params:
    side: positive_x
    distance_m: 0.1
    cross_position_ratio: 0.0
- kind: 'on'
  subject: mug
  reference: island_top
  params: {}
- kind: face_to
  subject: mug
  reference: wooden_bowl
  params: {}
- kind: 'on'
  subject: milk
  reference: island_top
  params: {}
- kind: position_limits_box
  subject: milk
  params:
    x_limits: [3.3, 3.4]
    y_limits: [-3.5, -3.35]
- kind: position_limits_box
  subject: mug
  params:
    x_limits: [2.2, 2.3]
    y_limits: [-3.95, -3.8]
- kind: not_next_to
  subject: milk
  reference: plate
  params:
    side: negative_x
